[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aplicação de página única: toda rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sistema interno: fora dos buscadores
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
